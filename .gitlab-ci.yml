# network-protocols-expert — CI/CD pipeline
#
# Runs only on the self-hosted runners on the home NAS (ARM64, Docker executor):
# tag `nas` for every job, tag `nas-deploy` for the deploy (protected refs only).
# Shared runners are disabled at project level.
#
# Conventions (GitLab "pipeline efficiency" and "pipeline security" guides):
# - images pinned by tag AND SHA-256 digest, all multi-arch (linux/arm64)
# - Python tooling pinned with hashes (requirements/ci.txt, pip --require-hashes)
# - DAG with `needs`, fail-fast lint stage, interruptible jobs
# - one pipeline per change: MR pipelines for branches with an open MR,
#   branch pipelines otherwise, tag pipelines for releases
# - deploy only from the default branch, serialised (resource_group), tracked
#   as the `production` environment
# - releases only from protected tags vX.Y.Z, notes taken from CHANGELOG.md
#
# Updating an image: change the tag and its digest together (see CONTRIBUTING.md).

workflow:
  name: "$CI_COMMIT_REF_NAME · $CI_PIPELINE_SOURCE"
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"

stages:
  - lint
  - test
  - security
  - build
  - verify
  - deploy
  - release

variables:
  GIT_DEPTH: "20"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"

default:
  tags: [nas]
  interruptible: true
  timeout: 15 minutes
  retry:
    max: 2
    when: [runner_system_failure, scheduler_failure, api_failure]

# ---------------------------------------------------------------- templates
.python:
  image: python:3.12.12-slim-bookworm@sha256:593bd06efe90efa80dc4eee3948be7c0fde4134606dd40d8dd8dbcade98e669c
  cache:
    key:
      files: [requirements/ci.txt]
    paths: [.cache/pip]
    when: always

.python-tools:
  extends: .python
  before_script:
    - pip install --require-hashes -r requirements/ci.txt

.on-default-branch:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ---------------------------------------------------------------- lint
lint:yaml:
  stage: lint
  extends: .python-tools
  needs: []
  script:
    - yamllint --strict .

lint:python:
  stage: lint
  extends: .python-tools
  needs: []
  script:
    - ruff check --exit-zero --output-format=gitlab --output-file=gl-code-quality-report.json .
    - ruff check .
    - ruff format --check --diff .
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      codequality: gl-code-quality-report.json

lint:commits:
  stage: lint
  extends: .python
  needs: []
  variables:
    GIT_DEPTH: "0"
  script:
    - apt-get -qq update >/dev/null && apt-get -qq install -y --no-install-recommends git >/dev/null
    - python3 scripts/check_commits.py "$CI_MERGE_REQUEST_DIFF_BASE_SHA" HEAD
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# ---------------------------------------------------------------- test
test:packet-builder:
  stage: test
  extends: .python
  needs: []
  script:
    - python3 tools/packet-builder.py --self-test

test:pages-static:
  stage: test
  extends: .python
  needs: []
  script:
    - python3 scripts/check_pages.py

# ---------------------------------------------------------------- security
security:secrets:
  stage: security
  image:
    name: zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    entrypoint: [""]
  needs: []
  variables:
    GIT_DEPTH: "0"
  script:
    - |
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        LOG_OPTS="--log-opts=${CI_MERGE_REQUEST_DIFF_BASE_SHA}..HEAD"
      else
        LOG_OPTS=""
      fi
      gitleaks git --redact --verbose --report-format sarif --report-path gitleaks.sarif $LOG_OPTS .
  artifacts:
    when: always
    expire_in: 1 week
    paths: [gitleaks.sarif]

# ---------------------------------------------------------------- build
# One URL per language (/fr/, /en/, /nl/, /de/) with hreflang, canonical, Open Graph,
# JSON-LD, sitemap.xml, robots.txt, 404 and a root language chooser (scripts/build_site.py).
build:site:
  stage: build
  extends: .python
  needs: [test:pages-static, test:packet-builder]
  variables:
    SITE_URL: https://learning.cuvelier.tech
  script:
    - python3 scripts/build_site.py public
  artifacts:
    paths: [public]
    expire_in: 1 week

# ---------------------------------------------------------------- verify
verify:browser:
  stage: verify
  image: mcr.microsoft.com/playwright/python:v1.64.1-noble@sha256:330d401ae23c905896a0c26c66c36fc971b621519e7b11b435a8328d7bf6e031
  needs: [build:site]
  # The image ships the browsers only, not the Python package: install it pinned
  # with hashes, at the same version as the image tag.
  # smoke_test.py: axe-core WCAG 2.2 AA (light + dark theme), CLS < 0.1, reduced motion,
  # hreflang/canonical, in-place language switch, 360 px, no external request.
  # axe-core is pinned (version + sha512 integrity) in the script and cached here.
  cache:
    key: axe-core-4.14.0
    paths: [.cache/]
  before_script:
    - pip install --require-hashes -r requirements/browser.txt
  script:
    - python3 scripts/smoke_test.py public

# ---------------------------------------------------------------- deploy
# Publishes public/ (from build:site) to https://learning.cuvelier.tech — PUBLIC, no auth.
# Runs on the dedicated `nas-deploy` runner: gitlab.com only hands it jobs from
# protected refs, it accepts only official alpine images, and it is the only
# runner that mounts the site volume (/site) served by the NAS nginx.
# Layout: /site/releases/<sha>/ + /site/current -> releases/<sha> (atomic swap),
# the 5 most recent releases are kept.
deploy:learning:
  stage: deploy
  image: alpine:3.22@sha256:2e0b81d60597f449baa56dc25d355367869d2dca4cd57e866f1e2b52af3eb55f
  tags: [nas-deploy]
  needs:
    - build:site
    - verify:browser
    - security:secrets
    - lint:yaml
    - lint:python
  interruptible: false
  resource_group: production
  environment:
    name: production
    url: https://learning.cuvelier.tech
  variables:
    GIT_STRATEGY: none
  script:
    - test -f public/index.html
    - test "$(cat public/version.txt)" = "$CI_COMMIT_SHA"
    - chmod -R u=rwX,go=rX public
    - REL="releases/$CI_COMMIT_SHA"
    - mkdir -p /site/releases
    - rm -rf "/site/$REL" "/site/$REL.tmp"
    - cp -a public "/site/$REL.tmp"
    - mv "/site/$REL.tmp" "/site/$REL"
    - ln -sfn "$REL" /site/current.new
    - mv -T /site/current.new /site/current
    - echo "current -> $(readlink /site/current)"
    - ls -1t /site/releases | tail -n +6 | while read -r old; do rm -rf "/site/releases/$old"; done
    # Smoke test through the real ingress (Traefik + TLS).
    - |
      for i in 1 2 3 4 5 6; do
        got=$(wget -qO- https://learning.cuvelier.tech/version.txt 2>/dev/null || true)
        if [ "$got" = "$CI_COMMIT_SHA" ]; then echo "live: $got"; exit 0; fi
        sleep 5
      done
      echo "smoke test failed: version.txt = '$got'"
      exit 1
  rules:
    - !reference [.on-default-branch, rules]

# ---------------------------------------------------------------- release
release:
  stage: release
  extends: .python
  needs: [build:site, verify:browser, security:secrets]
  interruptible: false
  script:
    - python3 scripts/create_release.py
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
